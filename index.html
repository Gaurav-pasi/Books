<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Private Library</title>
  <meta name="theme-color" content="#0e0805" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- Everything is local: no CDN, no font host. Nothing external can inject
       script onto the page where the master password is typed, and the whole
       reader works offline. -->
  <link rel="stylesheet" href="assets/css/fonts.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/redesign.css" />
</head>
<body>
  <!-- Login Screen -->
  <section id="login-screen" class="screen screen-login">
    <div class="login-card">
      <div class="login-emblem">📖</div>
      <h1>The Private Library</h1>
      <p class="login-subtitle">Enter your key to continue reading</p>
      <form id="login-form" autocomplete="off">
        <input
          type="password"
          id="password"
          placeholder="••••••••••"
          autocomplete="new-password"
          spellcheck="false"
          required
        />
        <button id="unlock-btn" type="submit">UNLOCK</button>
        <p id="login-error" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- Library Screen -->
  <section id="library-screen" class="screen screen-library" hidden>
    <header class="library-header">
      <h1>📚 The Library</h1>
      <button id="logout-btn" type="button">🔒 Lock</button>
    </header>
    <div class="library-body">
      <section id="continue-reading" class="continue-card" hidden aria-label="Continue reading"></section>
      <h2 class="shelf-title" id="shelf-title">Your shelf</h2>
      <div id="book-grid" class="book-grid" aria-labelledby="shelf-title"></div>
    </div>
    <footer class="library-footer">
      <span id="library-count"></span>
    </footer>
  </section>

  <!-- Reader Screen -->
  <section id="reader-screen" class="screen screen-reader" hidden>
    <header class="reader-header">
      <button id="back-to-library" type="button" aria-label="Back to library">←<span class="btn-label"> Library</span></button>
      <div class="reader-titles">
        <h2 id="reader-title"></h2>
        <p id="reader-chapter" class="reader-chapter"></p>
      </div>
      <div class="reader-tools">
        <button id="bookmark-btn" type="button" aria-label="Bookmark this section" title="Bookmark (B)">☆</button>
        <button id="panel-btn" type="button" aria-label="Contents, bookmarks and notes" title="Contents / Marks / Search (C)">☰</button>
        <button id="settings-btn" type="button" aria-label="Reading settings" aria-expanded="false" aria-controls="settings-pop" title="Reading settings">Aa</button>
        <button id="fullscreen-btn" type="button" aria-label="Full-screen reading" aria-pressed="false" title="Full-screen reading (F)">⛶</button>
      </div>
    </header>

    <!-- Reading settings popover -->
    <div id="settings-pop" class="settings-pop" hidden role="dialog" aria-label="Reading settings">
      <div class="set-row">
        <span class="set-label">Text size</span>
        <div class="set-ctrl stepper">
          <button id="font-smaller" type="button" aria-label="Decrease text size">A−</button>
          <output id="font-size-out" aria-live="polite">100%</output>
          <button id="font-larger" type="button" aria-label="Increase text size">A+</button>
        </div>
      </div>
      <div class="set-row">
        <span class="set-label">Page colour</span>
        <div class="set-ctrl swatches" role="radiogroup" aria-label="Page colour">
          <button type="button" class="swatch swatch-day" data-theme="day" role="radio" aria-checked="false"><span>Paper</span></button>
          <button type="button" class="swatch swatch-sepia" data-theme="sepia" role="radio" aria-checked="false"><span>Sepia</span></button>
          <button type="button" class="swatch swatch-night" data-theme="night" role="radio" aria-checked="false"><span>Night</span></button>
        </div>
      </div>
      <div class="set-row">
        <span class="set-label">Line spacing</span>
        <div class="set-ctrl segmented" role="radiogroup" aria-label="Line spacing">
          <button type="button" data-lh="compact" role="radio" aria-checked="false">Tight</button>
          <button type="button" data-lh="normal" role="radio" aria-checked="false">Normal</button>
          <button type="button" data-lh="relaxed" role="radio" aria-checked="false">Airy</button>
        </div>
      </div>
      <p class="set-hint"><kbd>←</kbd> <kbd>→</kbd> turn · <kbd>F</kbd> full screen · <kbd>B</kbd> bookmark · <kbd>C</kbd> contents</p>
    </div>

    <!-- Slide-in panel: contents, bookmarks, notes, search -->
    <div id="panel-backdrop" class="panel-backdrop" hidden></div>
    <aside id="side-panel" class="side-panel" hidden aria-label="Reader panel">
      <div class="panel-head">
        <div class="panel-tabs" role="tablist">
          <button class="panel-tab is-active" data-tab="contents" role="tab" type="button">Contents</button>
          <button class="panel-tab" data-tab="marks" role="tab" type="button">Marks</button>
          <button class="panel-tab" data-tab="search" role="tab" type="button">Search</button>
        </div>
        <button id="panel-close" type="button" aria-label="Close panel">✕</button>
      </div>

      <div class="panel-body">
        <section id="tab-contents" class="panel-pane"></section>

        <section id="tab-marks" class="panel-pane" hidden>
          <div class="note-editor">
            <label for="note-text" id="note-section-label">Note on this section</label>
            <textarea id="note-text" rows="4" placeholder="What does this mean for you? What will you actually do?"></textarea>
            <div class="note-actions">
              <button id="note-save" type="button">Save note</button>
              <button id="note-delete" type="button">Delete</button>
            </div>
          </div>
          <div id="marks-list"></div>
        </section>

        <section id="tab-search" class="panel-pane" hidden>
          <input type="search" id="search-input" placeholder="Search this library…" autocomplete="off" />
          <div id="search-results"></div>
        </section>
      </div>

      <div class="panel-foot">
        <button id="theme-btn" type="button">🌙 Night page</button>
      </div>
    </aside>
    <div class="flipbook-stage">
      <button id="prev-page" class="nav-btn nav-btn-prev" type="button" aria-label="Previous page">‹</button>
      <div id="flipbook" class="flipbook" role="document"></div>
      <button id="next-page" class="nav-btn nav-btn-next" type="button" aria-label="Next page">›</button>
    </div>
    <div class="reader-footer">
      <span id="page-indicator" aria-live="polite"></span>
      <input type="range" id="page-slider" min="0" max="0" value="0" aria-label="Jump to page" />
      <span id="progress-pct" class="progress-pct"></span>
    </div>
    <div class="read-progress" aria-hidden="true"><span id="read-progress-bar"></span></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </section>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="loading-overlay" hidden>
    <div class="spinner"></div>
    <p id="loading-text">Decrypting…</p>
  </div>

  <!-- Page-flip library (StPageFlip) — self-hosted, see assets/vendor/ -->
  <script src="assets/vendor/page-flip.browser.js" defer></script>
  <script src="assets/js/paginate.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
